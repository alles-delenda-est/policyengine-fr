name: Statute review

# Independent reviewer-agent gate (see docs/reviewer-agent-gate.md).
# Runs only when repo variable ENABLE_CLAUDE_REVIEW=true. Advisory: it posts a
# review comment and does NOT block auto-merge, and it never fails the build.
#
# TEMPORARY: the reviewer is routed through **Gemini** (GEMINI_API_KEY secret)
# while the ANTHROPIC_API_KEY is unavailable. To restore the Claude reviewer,
# revert this step to the anthropics/claude-code-action@v1 block (in git history)
# and remove .github/scripts/gemini_statute_review.py.

on:
  pull_request:
    types: [opened, synchronize, labeled]
    paths:
      - "policyengine_fr/variables/**"
      - "policyengine_fr/parameters/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write   # required by claude-code-action to mint an OIDC token

jobs:
  statute-review:
    # Only runs once explicitly enabled (and the secret is in place).
    if: ${{ vars.ENABLE_CLAUDE_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # TEMPORARY reroute: statute review via Gemini 3.6 Flash. The script is
      # advisory and never fails the build — a missing GEMINI_API_KEY, an unknown
      # model, or an API error exits 0 with a warning (no red X).
      - name: Independent statute review (Gemini — temporary)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/gemini_statute_review.py
