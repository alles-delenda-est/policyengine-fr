name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.17.4"
      - name: Check formatting
        run: ruff format --check .
      - name: Check lint rules
        run: ruff check .
  check-changelog:
    name: Check changelog fragment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for changelog fragment
        run: |
          FRAGMENTS=$(find changelog.d -type f ! -name '.gitkeep' | wc -l)
          if [ "$FRAGMENTS" -eq 0 ]; then
            echo "::error::No changelog fragment found in changelog.d/"
            exit 1
          fi
  Test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: make install
      - name: Run tests
        run: make test
  DocCurrency:
    name: Doc currency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: make install
      - name: Check docs are in sync with the code
        run: make check-docs
  UI:
    name: Studio UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
  Docker:
    name: Studio Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Studio container image
        run: docker build -t policyengine-fr-studio:ci .
      - name: Run container and smoke-test endpoints
        run: |
          docker run -d --name studio-ci -p 8080:8080 -e WEB_CONCURRENCY=1 policyengine-fr-studio:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8080/", timeout=5) as r:
              html = r.read().decode("utf-8")
              assert '<div id="root">' in html

          with urllib.request.urlopen("http://127.0.0.1:8080/api/metadata", timeout=5) as r:
              meta = json.loads(r.read())
              assert "lvt" in meta and "policies" in meta

          req = urllib.request.Request(
              "http://127.0.0.1:8080/api/simulate",
              data=json.dumps({
                  "year": "2024",
                  "household": {
                      "couple": False,
                      "adults": [{"age": 40, "salaire_brut": 45000}],
                      "patrimoine": {"taxe_fonciere_locale": 1800, "valeur_terrain_imposable": 90000},
                  },
                  "reforms": {"lvt_scenario": "S1"},
                  "include_curve": False,
              }).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=10) as r:
              sim = json.loads(r.read())
              assert sim["reform_active"] is True
              assert "revenu_disponible" in sim["deltas"]
          PY
      - name: Dump container logs on failure
        if: failure()
        run: docker logs studio-ci || true
      - name: Remove test container
        if: always()
        run: docker rm -f studio-ci || true
