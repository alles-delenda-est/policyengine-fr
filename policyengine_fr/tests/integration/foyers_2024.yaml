# Scénarios de bout en bout (whole-household) — revenus/barèmes 2024, métropole.
#
# Chaque cas part du seul `salaire_brut` et vérifie toute la chaîne du MVP:
#   salaire_brut → revenu_net_imposable → nombre_parts → impot_brut
#   → plafonnement_quotient_familial → décote → impot_revenu
#   → (CSG/CRDS, allocations familiales) → revenu_disponible.
#
# Les composantes individuelles (CSG, CRDS) et familiales (AF) sont vérifiées
# unitairement ailleurs; ici on contrôle leur intégration via l'agrégat
# `revenu_disponible` au niveau du ménage. Barèmes utilisés (revenus 2024,
# LF 2025, indexation +1,8 %):
#   - IR: 11 497 @ 11 % / 29 315 @ 30 % / 83 823 @ 41 % / 180 294 @ 45 %
#   - abattement salaires 10 % (plancher 504, plafond 14 426)
#   - plafonnement QF: 1 791 €/demi-part (général), 4 224 € (parent isolé, case T)
#   - décote: seuils 889 (seul) / 1 470 (couple), taux 0,4525
#   - CSG 9,2 % et CRDS 0,5 % sur 98,25 % du brut
#   - AF: BMAF 445,93 (jan.–mars) puis 466,44 (avr.–déc.) 2024,
#     0,32 BMAF (2 enfants) + 0,41 par enfant suppl., modulation 1/0,5/0,25.
#
# Ancrage externe: le cas célibataire 30 000 reproduit à l'euro le résultat du
# simulateur officiel impots.gouv.fr (revenus 2024) : impôt net 1 588 €.

- name: Célibataire sans enfant, salaire brut 30 000
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1:
        salaire_brut: 30_000
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
    familles:
      famille_1:
        parents: [declarant_1]
    menages:
      menage_1:
        personnes_de_reference: [declarant_1]
  output:
    revenu_net_imposable: 27_000        # 30 000 − abattement 3 000
    nombre_parts: 1
    impot_brut: 1_705.33                 # (27 000 − 11 497) × 11 %
    plafonnement_quotient_familial: 1_705.33  # pas de demi-part suppl.
    decote: 117.34                       # 889 − 0,4525 × 1 705,33
    impot_revenu: 1_587.99               # 1 705,33 − décote (≈ 1 588 officiel)
    # 30 000 − 1 587,99 − CSG 2 711,70 − CRDS 147,375 + AF 0
    revenu_disponible: 25_552.93

- name: Couple, deux enfants (8 et 10 ans), salaire brut 60 000
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      parent_1:
        salaire_brut: 60_000
      parent_2: {}
      enfant_1:
        age: 8
      enfant_2:
        age: 10
    foyers_fiscaux:
      foyer_1:
        declarants: [parent_1, parent_2]
        personnes_a_charge: [enfant_1, enfant_2]
    familles:
      famille_1:
        parents: [parent_1, parent_2]
        enfants: [enfant_1, enfant_2]
    menages:
      menage_1:
        personnes_de_reference: [parent_1]
        conjoints: [parent_2]
        enfants: [enfant_1, enfant_2]
  output:
    revenu_net_imposable: 54_000
    nombre_parts: 3                      # 2 déclarants + 2 × 0,5 part PAC
    impot_brut: 2_145.99                 # barème(18 000) × 3
    plafonnement_quotient_familial: 2_145.99  # avantage QF < plafond
    decote: 498.94                       # 1 470 − 0,4525 × 2 145,99
    impot_revenu: 1_647.05
    # AF annuelles taux plein = 3×142,6976 + 9×149,2608 = 1 771,44
    # 60 000 − 1 647,05 − CSG 5 423,40 − CRDS 294,75 + AF 1 771,44
    revenu_disponible: 54_406.24

- name: Parent isolé, un enfant (10 ans), salaire brut 40 000 (case T)
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1:
        salaire_brut: 40_000
      enfant_1:
        age: 10
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
        personnes_a_charge: [enfant_1]
        parent_isole: true
    familles:
      famille_1:
        parents: [declarant_1]
        enfants: [enfant_1]
    menages:
      menage_1:
        personnes_de_reference: [declarant_1]
        enfants: [enfant_1]
  output:
    revenu_net_imposable: 36_000
    nombre_parts: 2                      # 1 déclarant + 0,5 PAC + 0,5 parent isolé
    impot_brut: 1_430.66                 # barème(18 000) × 2
    # avantage QF (3 965,48 − 1 430,66 = 2 534,82) < plafond isolé 4 224
    plafonnement_quotient_familial: 1_430.66
    decote: 241.63                       # 889 − 0,4525 × 1 430,66
    impot_revenu: 1_189.03
    # un seul enfant: pas d'allocations familiales; ASF taux simple (1 enfant)
    # 40 000 − 1 189,03 − CSG 3 615,60 − CRDS 196,50 + AF 0 + ASF ≈ 2 336,08
    revenu_disponible: 37_334.953

- name: Célibataire, salaire brut 30 000, verse 6 000 de pension alimentaire
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1:
        salaire_brut: 30_000
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
        pensions_alimentaires_versees: 6_000
    familles:
      famille_1:
        parents: [declarant_1]
    menages:
      menage_1:
        personnes_de_reference: [declarant_1]
  output:
    revenu_net_imposable: 21_000        # 27 000 − 6 000 déduction
    nombre_parts: 1
    impot_brut: 1_045.33                 # (21 000 − 11 497) × 11 %
    plafonnement_quotient_familial: 1_045.33
    decote: 415.99                       # 889 − 0,4525 × 1 045,33
    impot_revenu: 629.34
    # 30 000 − 629,34 − CSG 2 711,70 − CRDS 147,375 − pension 6 000
    revenu_disponible: 20_511.58

- name: Couple, trois enfants (8, 10, 12 ans), salaire brut 120 000 — plafonnement QF
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      parent_1:
        salaire_brut: 120_000
      parent_2: {}
      enfant_1:
        age: 8
      enfant_2:
        age: 10
      enfant_3:
        age: 12
    foyers_fiscaux:
      foyer_1:
        declarants: [parent_1, parent_2]
        personnes_a_charge: [enfant_1, enfant_2, enfant_3]
    familles:
      famille_1:
        parents: [parent_1, parent_2]
        enfants: [enfant_1, enfant_2, enfant_3]
    menages:
      menage_1:
        personnes_de_reference: [parent_1]
        conjoints: [parent_2]
        enfants: [enfant_1, enfant_2, enfant_3]
  output:
    revenu_net_imposable: 108_000
    nombre_parts: 4                      # 2 déclarants + 2×0,5 + 1 part 3e enfant
    impot_brut: 6_821.32                 # barème(27 000) × 4
    # impôt sans QF = barème(54 000) × 2 = 18 730,96
    # avantage QF (11 909,64) > plafond 4 × 1 791 = 7 164 → plancher 11 566,96
    plafonnement_quotient_familial: 11_566.96
    decote: 0                            # impôt trop élevé pour la décote
    impot_revenu: 11_566.96
    # AF: 3 enfants, ressources > plafond 2 → tranche 3 (0,25) = 1 010,274375
    # 120 000 − 11 566,96 − CSG 10 846,80 − CRDS 589,50 + AF 1 010,274375
    revenu_disponible: 98_007.02
