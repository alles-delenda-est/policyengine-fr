# Scénarios de bout en bout (whole-household) — revenus/barèmes 2024, métropole.
#
# Chaque cas part du seul `salaire_brut` (salaire BRUT réel, spec 0001) et
# vérifie toute la chaîne du MVP:
#   salaire_brut → cotisations_salariales → salaire_declare
#   → salaire_imposable → revenu_net_imposable → nombre_parts → impot_brut
#   → plafonnement_quotient_familial → décote → impot_revenu
#   → (CSG/CRDS sur le brut, allocations familiales) → revenu_disponible.
#
# Passage brut → déclaré: cotisations_salariales = brut × 0,1131 ;
# csg_deductible = brut × 0,9825 × 0,068 ; salaire_declare = brut − cotisations
# − csg_deductible ; l'abattement de 10 % s'applique ensuite au salaire déclaré.
# La CSG (9,2 %) et la CRDS (0,5 %) restent assises sur 98,25 % du brut.
#
# Barèmes utilisés (revenus 2024, LF 2025, indexation +1,8 %):
#   - IR: 11 497 @ 11 % / 29 315 @ 30 % / 83 823 @ 41 % / 180 294 @ 45 %
#   - abattement salaires 10 % (plancher 504, plafond 14 426)
#   - plafonnement QF: 1 791 €/demi-part (général), 4 224 € (parent isolé, case T)
#   - décote: seuils 889 (seul) / 1 470 (couple), taux 0,4525
#   - CSG 9,2 % et CRDS 0,5 % sur 98,25 % du brut
#   - AF: BMAF 445,93 (jan.–mars) puis 466,44 (avr.–déc.) 2024,
#     0,32 BMAF (2 enfants) + 0,41 par enfant suppl., modulation 1/0,5/0,25.
#
# Ancrage externe (DGFiP, salaire DÉCLARÉ → IR) : tests/fixtures/oracle_values.yaml.
# Ici les entrées sont des salaires bruts, donc l'IR diffère de celui d'un
# déclaré de même montant; les valeurs verrouillent l'intégration du modèle.

- name: Célibataire sans enfant, salaire brut 30 000
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1:
        salaire_brut: 30_000
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
    familles:
      famille_1:
        parents: [declarant_1]
    menages:
      menage_1:
        personnes_de_reference: [declarant_1]
  output:
    cotisations_salariales: 3_393.00
    salaire_declare: 24_602.70           # 30 000 − 3 393 − 2 004,30
    revenu_net_imposable: 22_142.43      # 24 602,70 − abattement 2 460,27
    nombre_parts: 1
    impot_brut: 1_171.00                 # (22 142,43 − 11 497) × 11 %
    plafonnement_quotient_familial: 1_171.00
    decote: 359.12                       # 889 − 0,4525 × 1 171,00
    impot_revenu: 811.87                 # 1 171,00 − décote
    # 30 000 − 3 393 − 811,87 − CSG 2 711,70 − CRDS 147,375 + AF 0
    revenu_disponible: 22_936.05

- name: Couple, deux enfants (8 et 10 ans), salaire brut 60 000
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      parent_1:
        salaire_brut: 60_000
      parent_2: {}
      enfant_1:
        age: 8
      enfant_2:
        age: 10
    foyers_fiscaux:
      foyer_1:
        declarants: [parent_1, parent_2]
        personnes_a_charge: [enfant_1, enfant_2]
    familles:
      famille_1:
        parents: [parent_1, parent_2]
        enfants: [enfant_1, enfant_2]
    menages:
      menage_1:
        personnes_de_reference: [parent_1]
        conjoints: [parent_2]
        enfants: [enfant_1, enfant_2]
  output:
    # cotisations = 6 623,78 (parent_1 à 60 000 > PASS 46 368 : vieillesse
    # plafonnée limitée au PASS, T2 retraite/CEG au-delà)
    revenu_net_imposable: 44_430.86
    nombre_parts: 3                      # 2 déclarants + 2 × 0,5 part PAC
    impot_brut: 1_093.38
    plafonnement_quotient_familial: 1_093.38
    decote: 975.24
    impot_revenu: 118.14
    # AF taux plein = 1 771,44 (ressources sous le 1er plafond)
    # 60 000 − 6 623,78 − 118,14 − CSG 5 423,40 − CRDS 294,75 + AF 1 771,44
    revenu_disponible: 49_311.37

- name: Parent isolé, un enfant (10 ans), salaire brut 40 000 (case T)
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1:
        salaire_brut: 40_000
      enfant_1:
        age: 10
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
        personnes_a_charge: [enfant_1]
        parent_isole: true
    familles:
      famille_1:
        parents: [declarant_1]
        enfants: [enfant_1]
    menages:
      menage_1:
        personnes_de_reference: [declarant_1]
        enfants: [enfant_1]
  output:
    # cotisations = 4 524 (40 000 × 0,1131)
    revenu_net_imposable: 29_523.24      # (40 000 − 4 524 − 2 672,40) × 0,9
    nombre_parts: 2                      # 1 déclarant + 0,5 PAC + 0,5 parent isolé
    impot_brut: 718.22
    plafonnement_quotient_familial: 718.22
    decote: 564.01                       # 889 − 0,4525 × 718,22
    impot_revenu: 154.21
    # un seul enfant: pas d'AF; ASF taux simple (1 enfant) ≈ 2 336,09
    # 40 000 − 4 524 − 154,21 − CSG 3 615,60 − CRDS 196,50 + ASF 2 336,09
    revenu_disponible: 33_845.78

- name: Célibataire, salaire brut 30 000, verse 6 000 de pension alimentaire
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1:
        salaire_brut: 30_000
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
        pensions_alimentaires_versees: 6_000
    familles:
      famille_1:
        parents: [declarant_1]
    menages:
      menage_1:
        personnes_de_reference: [declarant_1]
  output:
    revenu_net_imposable: 16_142.43      # 22 142,43 − 6 000 déduction
    nombre_parts: 1
    impot_brut: 511.00                   # (16 142,43 − 11 497) × 11 %
    plafonnement_quotient_familial: 511.00
    decote: 657.77                       # 889 − 0,4525 × 511,00 (> impôt → IR 0)
    impot_revenu: 0.00
    # 30 000 − 3 393 − 0 − CSG 2 711,70 − CRDS 147,375 − pension 6 000
    revenu_disponible: 17_747.93

- name: Couple, trois enfants (8, 10, 12 ans), salaire brut 120 000 — plafonnement QF
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      parent_1:
        salaire_brut: 120_000
      parent_2: {}
      enfant_1:
        age: 8
      enfant_2:
        age: 10
      enfant_3:
        age: 12
    foyers_fiscaux:
      foyer_1:
        declarants: [parent_1, parent_2]
        personnes_a_charge: [enfant_1, enfant_2, enfant_3]
    familles:
      famille_1:
        parents: [parent_1, parent_2]
        enfants: [enfant_1, enfant_2, enfant_3]
    menages:
      menage_1:
        personnes_de_reference: [parent_1]
        conjoints: [parent_2]
        enfants: [enfant_1, enfant_2, enfant_3]
  output:
    # cotisations = 12 695,78 (120 000 > PASS : vieillesse plafonnée limitée au
    # PASS, T2 retraite/CEG au-delà)
    revenu_net_imposable: 89_358.31
    nombre_parts: 4                      # 2 déclarants + 2×0,5 + 1 part 3e enfant
    impot_brut: 4_770.73
    # avantage QF plafonné (plancher retenu)
    plafonnement_quotient_familial: 5_974.45
    decote: 0
    impot_revenu: 5_974.45
    # AF 3 enfants, ressources sous le 2e plafond (base déclarée) → demi-taux
    # 120 000 − 12 695,78 − 5 974,45 − CSG 10 846,80 − CRDS 589,50 + AF 2 020,55
    revenu_disponible: 91_914.02
