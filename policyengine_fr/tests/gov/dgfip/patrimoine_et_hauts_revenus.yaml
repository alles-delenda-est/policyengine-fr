- name: IFI sous le seuil de 1,3 M€ après abattement de 30 % sur la résidence principale
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      d1: {}
    foyers_fiscaux:
      f1:
        declarants: [d1]
        patrimoine_immobilier_residence_principale: 1_800_000
  output:
    # 1 800 000 × 0,70 = 1 260 000 < 1 300 000 -> IFI nul
    ifi: 0

- name: IFI à 1 350 000 € — application de la décote entre 1,3 M€ et 1,4 M€ (CGI art. 977 II)
  absolute_error_margin: 0.05
  period: 2024
  input:
    individus:
      d1: {}
    foyers_fiscaux:
      f1:
        declarants: [d1]
        patrimoine_immobilier_autre: 1_350_000
  output:
    # brut = 500 000 × 0,5 % (2 500) + 50 000 × 0,7 % (350) = 2 850 €
    # décote = 17 500 − 0,0125 × 1 350 000 = 17 500 − 16 875 = 625 € -> net = 2 225 €
    ifi: 2_225.00

- name: IFI à 3 000 000 € — barème plein jusqu'à la tranche 1 %
  absolute_error_margin: 0.1
  period: 2024
  input:
    individus:
      d1: {}
    foyers_fiscaux:
      f1:
        declarants: [d1]
        patrimoine_immobilier_autre: 3_000_000
  output:
    # 500k×0,5% (2 500) + 1 270k×0,7% (8 890) + 430k×1,0% (4 300) = 15 690 €
    ifi: 15_690.00

- name: Taxe foncière et THRS avec frais de gestion de l'État de 3 % (CGI art. 1641, LVTShift S1)
