# Fiscalité du patrimoine, des revenus fonciers, du capital et des hauts revenus
# (réutilisant les règles et sources vérifiées de LVTShift et budget_fr_sim_test).

- name: CEHR célibataire à 600 000 € de RFR (3 % sur 250-500 k€ + 4 % au-delà)
  absolute_error_margin: 0.1
  period: 2024
  input:
    individus:
      d1: {revenus_capital: 600_000}
    foyers_fiscaux:
      f1: {declarants: [d1]}
  output:
    # RFR = 600 000 -> CEHR = 250 000 × 3 % + 100 000 × 4 % = 7 500 + 4 000 = 11 500 €
    revenu_fiscal_de_reference: 600_000
    cehr: 11_500.00
    pfu_ir: 76_800.00                        # 600 000 × 12,8 %
    prelevements_sociaux_patrimoine: 103_200.00 # 600 000 × 17,2 %

- name: CEHR couple à 600 000 € de RFR (3 % au-delà de 500 k€ seulement)
  absolute_error_margin: 0.1
  period: 2024
  input:
    individus:
      d1: {revenus_capital: 600_000}
      d2: {}
    foyers_fiscaux:
      f1: {declarants: [d1, d2]}
  output:
    # (600 000 − 500 000) × 3 % = 3 000 €
    cehr: 3_000.00

- name: Revenus fonciers au régime micro-foncier (10 000 € <= 15 000 € -> abattement 30 %)
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      d1: {}
    foyers_fiscaux:
      f1:
        declarants: [d1]
        revenus_fonciers_bruts: 10_000
        regime_micro_foncier: true
  output:
    # net foncier = 7 000 € ; PS = 7 000 × 17,2 % = 1 204 € ;
    # CSG déductible (art. 154 quinquies II) = 7 000 × 6,8 % = 476 € -> RNI = 6 524 €
    revenus_fonciers_nets: 7_000.00
    prelevements_sociaux_patrimoine: 1_204.00
    revenu_net_imposable: 6_524.00

- name: Revenus fonciers au-delà de 15 000 € — bascule automatique au régime réel
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      d1: {}
    foyers_fiscaux:
      f1:
        declarants: [d1]
        revenus_fonciers_bruts: 20_000
        charges_foncieres_reelles: 8_000
        regime_micro_foncier: true
  output:
    revenus_fonciers_nets: 12_000.00
    prelevements_sociaux_patrimoine: 2_064.00

- name: "Plus-value immobilière imposable de 50 000 € (S2 LVTShift : 19 % IR + 17,2 % PS = 36,2 %)"
  absolute_error_margin: 0.01
