# Décote de l'impôt sur le revenu (CGI art. 197-I-4), revenus 2024 (LF 2025).
# Seuil personne seule 889 €, seuil couple 1 470 €, taux 0,4525.
# décote = max(0, seuil − taux × impôt après plafonnement du QF).
# Barème : 11 497 (11 %) / 29 315 (30 %).
- name: Célibataire (1 part), RNI 16 000 — décote applicable
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1: {}
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
        revenu_net_imposable: 16_000
  output:
    # impôt = (16 000 − 11 497) × 0,11 = 495.33
    plafonnement_quotient_familial: 495.33
    # décote = 889 − 0,4525 × 495.33 = 664.86
    decote: 664.86

- name: Célibataire (1 part), RNI 35 000 — impôt trop élevé, décote nulle
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1: {}
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
        revenu_net_imposable: 35_000
  output:
    # impôt = 3 665.48 ; 889 − 0,4525 × 3 665.48 < 0 -> décote = 0
    decote: 0

- name: Couple (2 parts), RNI 30 000 — décote au seuil couple
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1: {}
      declarant_2: {}
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1, declarant_2]
        revenu_net_imposable: 30_000
  output:
    # impôt = ((15 000 − 11 497) × 0,11) × 2 = 770.66
    plafonnement_quotient_familial: 770.66
    # décote = 1 470 − 0,4525 × 770.66 = 1 121.28
    decote: 1_121.28

- name: Couple (2 parts), RNI 80 000 — impôt trop élevé, décote nulle
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1: {}
      declarant_2: {}
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1, declarant_2]
        revenu_net_imposable: 80_000
  output:
    decote: 0
