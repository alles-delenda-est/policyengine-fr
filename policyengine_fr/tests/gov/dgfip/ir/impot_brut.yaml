# Impôt brut = barème(rni / parts) * parts, barème revenus 2024
# (11 497 @ 11 % / 29 315 @ 30 % / 83 823 @ 41 % / 180 294 @ 45 %).
# Avant plafonnement du quotient familial et décote.
- name: Célibataire (1 part), RNI 30 000
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1: {}
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
        revenu_net_imposable: 30_000
  output:
    nombre_parts: 1.0
    impot_brut: 2_165.48

