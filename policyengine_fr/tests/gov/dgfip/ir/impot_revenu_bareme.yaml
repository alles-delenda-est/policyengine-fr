# thresholds 11 294 / 28 797 / 82 341 / 177 106.
- name: Revenu nul - aucun impôt
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      individu_1: {}
    foyers_fiscaux:
      foyer_1:
        declarants: [individu_1]
        revenu_net_imposable: 0
