# Impôt sur le revenu net (CGI art. 197), revenus 2024.
# impôt = max(0, impôt après plafonnement du QF − décote).
# Barème : 11 497 (11 %) / 29 315 (30 %). Décote : seuil seul 889 €,
# seuil couple 1 470 €, taux 0,4525.
- name: Célibataire (1 part), RNI 16 000 — décote efface l'impôt
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1: {}
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
        revenu_net_imposable: 16_000
  output:
    # impôt = (16 000 − 11 497) × 0,11 = 495.33 ; décote = 664.86 > impôt -> 0
    plafonnement_quotient_familial: 495.33
    decote: 664.86
    impot_revenu: 0

- name: Célibataire (1 part), RNI 18 000 — décote partielle, impôt positif
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1: {}
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
        revenu_net_imposable: 18_000
  output:
    # impôt = (18 000 − 11 497) × 0,11 = 715.33
    plafonnement_quotient_familial: 715.33
    # décote = 889 − 0,4525 × 715.33 = 565.31
    decote: 565.31
    # impôt net = 715.33 − 565.31 = 150.02
    impot_revenu: 150.02

