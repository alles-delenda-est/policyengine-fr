# Impôt sur le revenu net (CGI art. 197), revenus 2024.
# impôt = max(0, impôt après plafonnement du QF − décote).
# Barème : 11 294 (11 %) / 28 797 (30 %). Décote : seuil seul 889 €,
# seuil couple 1 470 €, taux 0,4525.
- name: Célibataire (1 part), RNI 16 000 — décote efface l'impôt
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1: {}
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
        revenu_net_imposable: 16_000
  output:
    # impôt = 517.66 ; décote = 654.76 > impôt -> impôt net = 0
    plafonnement_quotient_familial: 517.66
    decote: 654.76
    impot_revenu: 0

- name: Célibataire (1 part), RNI 18 000 — décote partielle, impôt positif
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1: {}
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
        revenu_net_imposable: 18_000
  output:
    # impôt = (18 000 − 11 294) × 0,11 = 737.66
    plafonnement_quotient_familial: 737.66
    # décote = 889 − 0,4525 × 737.66 = 555.21
    decote: 555.21
    # impôt net = 737.66 − 555.21 = 182.45
    impot_revenu: 182.45

- name: Célibataire (1 part), RNI 35 000 — pas de décote
  absolute_error_margin: 0.01
