    decote: 0
    impot_revenu: 3_786.23

- name: Couple (2 parts), RNI 80 000 — pas de décote
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1: {}
      declarant_2: {}
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1, declarant_2]
        revenu_net_imposable: 80_000
  output:
    # impôt = ((40 000 − 11 294) × 0,11 + ... ) × 2 = 10 572.46 ; décote = 0
    decote: 0
    impot_revenu: 10_572.46
