# Cotisations patronales, réduction générale (ex-Fillon) et coût du travail (spec 0008).
# SMIC 2024-01 = 11,65 × 151,67 × 12 = 21 203,466 € ; PASS 2024 = 46 368 €.

- name: Salarié au SMIC (< 50 salariés) — réduction générale maximale (T = 0,3194)
  absolute_error_margin: 1.0
  period: 2024
  input:
    salaire_brut: 21_203.47
    effectif_entreprise: 10
  output:
    # C = 0,3194 -> réduction générale = 0,3194 × 21 203,47 = 6 772,39 (OF: 6 772,24)
    reduction_generale: 6_772.39
    # taux patronal total à 1 SMIC (maladie 7 %, famille 3,45 %, vieillesse 10,57 %,
    # retraite T1+CEG 6,01 %, chômage+AGS 4,25 %, FNAL 0,10 %, CSA+dial 0,316 %, AT/MP 2,12 % = 33,816 %)
    cotisations_patronales: 7_170.17
    cout_du_travail: 21_601.25

