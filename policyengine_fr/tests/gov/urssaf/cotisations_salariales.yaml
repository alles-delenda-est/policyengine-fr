# Cotisations sociales salariales (part salariale, hors CSG/CRDS), 2024 (spec 0004).
# Barème par tranche, PASS 2024 = 46 368 € :
#   vieillesse plafonnée 6,90 % (0-1 PASS) + déplafonnée 0,40 % (totalité)
#   + retraite comp. AGIRC-ARRCO T1 3,15 % / CEG T1 0,86 % (0-1 PASS)
#   + T2 8,64 % / CEG T2 1,08 % (1-8 PASS)
#   + cadres : CET 0,14 % (1-8 PASS) et APEC 0,024 % (0-4 PASS).
# salaire_declare = brut − cotisations − csg_deductible (brut × 0,9825 × 0,068).

- name: Salaire ≤ 1 PASS (non cadre) — somme des taux de tranche 1
  absolute_error_margin: 0.01
  period: 2024
  input:
    salaire_brut: 30_000
  output:
    # 30 000 × (0,069 + 0,004 + 0,0315 + 0,0086) = 30 000 × 0,1131
    cotisations_salariales: 3_393.00
    salaire_declare: 24_602.70          # 30 000 − 3 393 − 2 004,30

- name: Salaire exactement au PASS (non cadre)
  absolute_error_margin: 0.01
  period: 2024
  input:
    salaire_brut: 46_368
  output:
    # 46 368 × 0,1131 (tout en tranche 1)
    cotisations_salariales: 5_244.22

- name: Salaire > 1 PASS (non cadre) — plafonnement vieillesse + tranche 2
  absolute_error_margin: 0.01
  period: 2024
  input:
    salaire_brut: 60_000
  output:
    # vieillesse plaf 0,069×46 368 = 3 199,392 ; déplaf 0,004×60 000 = 240 ;
    # retraite T1 0,0315×46 368 = 1 460,592 ; T2 0,0864×13 632 = 1 177,8048 ;
    # CEG T1 0,0086×46 368 = 398,7648 ; CEG T2 0,0108×13 632 = 147,2256
    cotisations_salariales: 6_623.78
    salaire_declare: 49_367.62          # 60 000 − 6 623,78 − 4 008,60

- name: Salaire > 1 PASS, cadre — supplément CET + APEC
  absolute_error_margin: 0.01
  period: 2024
  input:
    salaire_brut: 60_000
    cadre: true
  output:
    # 6 623,78 + CET 0,0014×13 632 (19,0848) + APEC 0,00024×60 000 (14,40)
    cotisations_salariales: 6_657.26

- name: Salaire nul — aucune cotisation
  absolute_error_margin: 0.01
  period: 2024
  input:
    salaire_brut: 0
  output:
    cotisations_salariales: 0
    salaire_declare: 0
