- name: Couple, deux enfants, avril 2024 (BMAF revalorisée à 466,44 €)
  absolute_error_margin: 0.01
  period: 2024-04
  input:
    # Note: salaire_brut omis volontairement — un bug policyengine-core
    # (get_known_periods split incorrecte) plante quand une variable YEAR est
    # fournie pour un test de période non-janvier. Ressources = 0 => taux plein,
    # ce qui ne change pas l'objet du test (vérifier la BMAF du 1er avril).
    individus:
      parent_1: {}
      parent_2: {}
      enfant_1: {age: 8}
      enfant_2: {age: 10}
    familles:
      famille_1: {parents: [parent_1, parent_2], enfants: [enfant_1, enfant_2]}
  output:
    # 466,44 × 0,32 = 149,2608 (revalorisation du 1er avril)
    allocations_familiales: 149.2608

- name: Enfant de 20 ans exclu (la limite est stricte < 20)
  absolute_error_margin: 0.01
  period: 2024-01
  input:
    individus:
      parent_1: {salaire_brut: 30_000}
      parent_2: {}
      enfant_1: {age: 8}
      enfant_2: {age: 10}
      enfant_3: {age: 20}
    familles:
      famille_1: {parents: [parent_1, parent_2], enfants: [enfant_1, enfant_2, enfant_3]}
  output:
    # l'aîné de 20 ans n'ouvre plus droit -> 2 enfants -> 445,93 × 0,32
    allocations_familiales: 142.6976

- name: Enfant de 19 ans encore à charge (limite non atteinte)
  absolute_error_margin: 0.01
  period: 2024-01
  input:
    individus:
      parent_1: {salaire_brut: 30_000}
      parent_2: {}
      enfant_1: {age: 8}
      enfant_2: {age: 10}
      enfant_3: {age: 19}
    familles:
      famille_1: {parents: [parent_1, parent_2], enfants: [enfant_1, enfant_2, enfant_3]}
  output:
    # 3 enfants, tous < 20 (le cadet de 19 ans ouvre encore droit).
    # base 445,93 × (0,32 + 0,41) = 325,5289 ;
    # l'enfant de 19 ans (>= 14) ouvre droit à la majoration d'âge, sans
    # exclusion d'aîné car la famille a 3 enfants : + 445,93 × 0,16 = 71,3488.
    # total 396,8777 (à comparer au cas de l'enfant de 20 ans, exclu).
    allocations_familiales: 396.8777

