# RSA = max(forfaitaire − forfait logement − ressources, 0), versé si un parent
# a >= 25 ans ou charge d'enfant (CASF L262-4) et si le montant >= 6 € (R262-39).
- name: Personne seule, sans revenu, janvier 2024
  absolute_error_margin: 0.01
  period: 2024-01
  input:
    individus:
      adulte_1: {age: 40}
    familles:
      famille_1: {parents: [adulte_1], enfants: []}
  output:
    # 607,75 − 72,93 = 534,82
    rsa: 534.82

- name: Personne seule, sans revenu, avril 2024 (revalorisation)
  absolute_error_margin: 0.01
  period: 2024-04
  input:
    individus:
      adulte_1: {age: 40}
    familles:
      famille_1: {parents: [adulte_1], enfants: []}
  output:
    # 635,71 − 76,2852 = 559,4248
    rsa: 559.4248

