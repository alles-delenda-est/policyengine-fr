# Revenu disponible du ménage (agrégat de tête du MVP), revenus 2024.
# revenu_disponible = salaire_brut − impot_revenu − csg − crds
#                     + allocations_familiales (annualisées).
# Valeurs de référence = combinaison arithmétique des composantes déjà
# testées unitairement (barème 11 497 @ 11 % / 29 315 @ 30 % / 83 823 @ 41 %,
# décote seuils 889 / 1 470 au taux 0,4525, CSG 9,2 % et CRDS 0,5 % sur
# 98,25 % du brut, BMAF 445,93 puis 466,44 au 1er avril 2024).

- name: Célibataire sans enfant, salaire brut 30 000
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1:
        salaire_brut: 30_000
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
    familles:
      famille_1:
        parents: [declarant_1]
    menages:
      menage_1:
        personnes_de_reference: [declarant_1]
  output:
    # salaire imposable = 27 000 ; impôt brut = 1 705.33 ; décote = 117.34 ;
    # impôt net = 1 587.99 ; CSG = 2 711.70 ; CRDS = 147.375 ; AF = 0.
    # 30 000 − 1 587.99 − 2 711.70 − 147.375 = 25 552.93
    # (confirmé par le simulateur officiel impots.gouv.fr : impôt net 1 588 €)
    revenu_disponible: 25_552.93

- name: Couple deux enfants (8 et 10 ans), salaire brut 60 000 — AF à taux plein
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      parent_1:
        salaire_brut: 60_000
      parent_2: {}
      enfant_1:
        age: 8
      enfant_2:
        age: 10
    foyers_fiscaux:
      foyer_1:
        declarants: [parent_1, parent_2]
        personnes_a_charge: [enfant_1, enfant_2]
    familles:
      famille_1:
        parents: [parent_1, parent_2]
        enfants: [enfant_1, enfant_2]
    menages:
      menage_1:
        personnes_de_reference: [parent_1]
        conjoints: [parent_2]
        enfants: [enfant_1, enfant_2]
  output:
    # RNI = 54 000 ; 3 parts ; impôt brut = 2 145.99 (pas de plafonnement) ;
    # décote couple = 498.94 ; impôt net = 1 647.05 ;
    # CSG = 5 423.40 ; CRDS = 294.75 ; AF taux plein = 1 771.44.
    # 60 000 − 1 647.05 − 5 423.40 − 294.75 + 1 771.44 = 54 406.24
    revenu_disponible: 54_406.24

- name: Célibataire haut revenu sans enfant, salaire brut 150 000
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1:
        salaire_brut: 150_000
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
    familles:
      famille_1:
        parents: [declarant_1]
    menages:
      menage_1:
        personnes_de_reference: [declarant_1]
  output:
    # salaire imposable = 135 574 (abattement plafonné à 14 426) ; 1 part ;
    # impôt = 17 818×0,11 + 54 508×0,30 + 51 751×0,41 = 39 530.29 ;
    # CSG = 13 558.50 ; CRDS = 736.875 ; AF = 0.
    # 150 000 − 39 530.29 − 13 558.50 − 736.875 = 96 174.34
    revenu_disponible: 96_174.34
