# Revenu disponible du ménage (agrégat de tête du MVP), revenus 2024.
# L'entrée `salaire_brut` est un salaire BRUT réel (spec 0001). Le modèle en
# dérive le salaire déclaré (brut − cotisations salariales − CSG déductible),
# base de l'IR, tandis que la CSG/CRDS reste assise sur 98,25 % du brut.
#   revenu_disponible = salaire_brut − cotisations_salariales
#                       − impot_revenu − csg − crds − pensions_versees
#                       + allocations_familiales + ASF (annualisées).
# cotisations_salariales = brut × 0,1131. csg_deductible = brut × 0,9825 × 0,068.
# Ancrage DGFiP officiel (déclaré → IR) : voir tests/fixtures/oracle_values.yaml.

- name: Célibataire sans enfant, salaire brut 30 000
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1:
        salaire_brut: 30_000
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
    familles:
      famille_1:
        parents: [declarant_1]
    menages:
      menage_1:
        personnes_de_reference: [declarant_1]
  output:
    # cotisations = 3 393 ; salaire déclaré = 24 602,70 ; imposable = 22 142,43 ;
    # impôt net = 811,87 ; CSG = 2 711,70 ; CRDS = 147,375 ; AF = 0.
    # 30 000 − 3 393 − 811,87 − 2 711,70 − 147,375 = 22 936,05
    revenu_disponible: 22_936.05

- name: Couple deux enfants (8 et 10 ans), salaire brut 60 000 — AF à taux plein
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      parent_1:
        salaire_brut: 60_000
      parent_2: {}
      enfant_1:
        age: 8
      enfant_2:
        age: 10
    foyers_fiscaux:
      foyer_1:
        declarants: [parent_1, parent_2]
        personnes_a_charge: [enfant_1, enfant_2]
    familles:
      famille_1:
        parents: [parent_1, parent_2]
        enfants: [enfant_1, enfant_2]
    menages:
      menage_1:
        personnes_de_reference: [parent_1]
        conjoints: [parent_2]
        enfants: [enfant_1, enfant_2]
  output:
    # cotisations = 6 786 ; RNI = 44 284,86 ; impôt net = 94,81 ;
    # CSG = 5 423,40 ; CRDS = 294,75 ; AF taux plein = 1 771,44.
    # 60 000 − 6 786 − 94,81 − 5 423,40 − 294,75 + 1 771,44 = 49 172,48
    revenu_disponible: 49_172.48

- name: Célibataire haut revenu sans enfant, salaire brut 150 000
  absolute_error_margin: 0.01
  period: 2024
  input:
    individus:
      declarant_1:
        salaire_brut: 150_000
    foyers_fiscaux:
      foyer_1:
        declarants: [declarant_1]
    familles:
      famille_1:
        parents: [declarant_1]
    menages:
      menage_1:
        personnes_de_reference: [declarant_1]
  output:
    # cotisations = 16 965 ; RNI = 110 712,15 ; impôt net = 29 336,93 ;
    # CSG = 13 558,50 ; CRDS = 736,875 ; AF = 0.
    # 150 000 − 16 965 − 29 336,93 − 13 558,50 − 736,875 = 89 402,70
    revenu_disponible: 89_402.70
