core:
  modelled:
    - Impôt sur le revenu — barème progressif par part de quotient familial
    - Quotient familial — nombre de parts (déclarants + personnes à charge, majoration parent isolé)
    - Plafonnement du quotient familial
    - Décote
    - CSG et CRDS sur les revenus d'activité salariée (assiette 98,25 %)
    - Cotisations sociales salariales — par risque avec plafonds (tranches PASS), statut cadre (passage du salaire brut au salaire déclaré, case 1AJ)
    - Allocations familiales (base, modulation selon les revenus, majoration pour âge)
    - Allocation de soutien familial (ASF) — taux simple, en complément différentiel de la pension alimentaire perçue (famille monoparentale)
    - Pensions alimentaires — déduction du revenu global (versées) et imposition après abattement de 10 % (perçues)
    - Pensions de retraite — revenu imposable (abattement de 10 % mutualisé avec les pensions alimentaires) et CSG/CRDS à taux réduit selon le revenu fiscal de référence
    - Revenu de solidarité active (RSA) — socle : montant forfaitaire (échelle d'équivalence, RSA majoré parent isolé), forfait logement, base ressources différentielle
    - Revenu disponible — agrégat de tête de l'MVP (revenus 2024)
  not_modelled:
    - Réductions et crédits d'impôt
    - Contribution exceptionnelle sur les hauts revenus
    - Prélèvements sociaux sur les revenus du capital et de remplacement
    - Cotisations sociales salariales détaillées (par risque, plafonds SS, statut cadre, allègements bas salaires) et cotisations patronales
    - Autres prestations sociales (APL, prime d'activité, complément familial, PAJE, ARS, AAH, ASPA…)
    - Revenus non salariés et revenus du capital (hors salaires, pensions de retraite et pensions alimentaires perçues)
  simplifications:
    # Explicit scope-narrowings: modelled, but with a documented departure from
    # the exact statute. Surfaced here so the reviewer-agent gate's
    # "silent scope-narrowing" check can find them.
    - >-
      Allocation de soutien familial — le droit est inféré du seul fait que la
      famille n'a qu'un parent (proxy MVP). L'ASF est versée en complément
      différentiel : la pension alimentaire perçue (ramenée au mois) est
      défalquée de l'ASF pleine (taux simple 0,422 BMAF), bornée à zéro. La
      comparaison est faite au niveau de la famille et non enfant par enfant ;
      la pension saisie est supposée être une pension pour enfant (une prestation
      compensatoire ne doit pas y figurer). Non modélisés : le taux majoré
      « orphelin de deux parents », le recouvrement de l'avance sur le parent
      débiteur (transfert CAF↔débiteur sans effet sur la famille), et le cas d'un
      parent défaillant au sein d'un couple (sous-estimation, l'éligibilité reste
      « parent unique »). Métropole uniquement.
    - >-
      Allocations familiales — modulation des ressources : le modèle utilise la
      somme des salaires imposables de l'année courante (N) en lieu et place de
      la base ressources N-2 réelle (revenu net catégoriel de l'année N-2,
      art. R532-3 CSS). Les deux coïncident pour un revenu stable ; elles
      divergent pour tout ménage dont le revenu a changé d'une année sur l'autre.
      Métropole uniquement ; garde alternée, forfait des 20 ans et plancher de
      versement non modélisés.
    - >-
      Pensions alimentaires versées — le montant saisi est pris comme déjà
      déductible : le plafond de déduction par enfant majeur (CGI art. 156, II,
      2°) et les conditions d'éligibilité (décision de justice, état de besoin)
      ne sont pas appliqués par le modèle, à l'image de openfisca-france qui
      retient les montants déclarés. La base imposable est par ailleurs bornée
      à zéro (les déficits reportables ne sont pas modélisés).
    - >-
      Pensions alimentaires perçues — abattement de 10 % sur les pensions
      (CGI art. 158, 5, a) : le plancher est appliqué par bénéficiaire (borné à
      sa propre pension) puis le total est plafonné au niveau du foyer fiscal,
      ce qui approche la règle légale de répartition exacte du plafond.
    - >-
      Cotisations salariales par risque (specs 0001, 0004) — l'entrée
      `salaire_brut` est un salaire BRUT réel, converti en salaire déclaré
      (case 1AJ) en retranchant les cotisations salariales et la CSG déductible
      (CGI art. 154 quinquies, appliquée une seule fois dans `salaire_declare`).
      Les cotisations sont calculées par risque avec plafonds (vieillesse
      plafonnée/déplafonnée, retraite complémentaire AGIRC-ARRCO T1/T2 et CEG,
      tranches délimitées par le PASS ; CET et APEC pour les cadres via l'entrée
      `cadre`). L'IR porte sur le salaire déclaré et la CSG/CRDS sur 98,25 % du
      brut : l'ancienne double-convention brut/déclaré est levée et
      `revenu_disponible` retranche les cotisations. Non modélisés : chômage et
      maladie salariales (nuls depuis 2018, remplacés par la CSG), les
      exonérations spécifiques (heures supplémentaires, apprentis, ZRR) et le
      statut cadre lorsqu'il n'est pas fourni (défaut non cadre). Les allègements
      bas salaires (réduction générale) sont côté employeur (docs/specs/0008).
    - >-
      Allocations familiales — complément dégressif non modélisé : la
      modulation applique les taux plein/moitié/quart en marche d'escalier aux
      deux plafonds, sans le complément dégressif (CSS art. D521-1, al. 3) qui
      lisse chaque franchissement. Les montants sont exacts loin des seuils;
      les taux marginaux au voisinage immédiat des plafonds sont surestimés
      (perte en falaise d'environ 745 €/an au premier seuil au lieu d'un
      lissage).
    - >-
      Prestations familiales versées brutes de CRDS — les AF et l'ASF sont
      comptées pour leur montant brut; la CRDS de 0,5 % due sur les
      prestations familiales n'est pas prélevée dans `revenu_disponible`
      (surestimation d'environ 0,5 % du montant des prestations). La
      majoration pour âge des AF est par ailleurs accordée dès le mois du
      quatorzième anniversaire au lieu du mois suivant (un mois de trop, une
      seule fois par enfant).
    - >-
      Quotient familial — cas du veuf/de la veuve avec personne à charge non
      représentable : le CGI art. 194 lui accorde les parts de base d'un couple
      marié (p. ex. 2,5 parts avec un enfant); le modèle ne peut le saisir que
      comme déclarant seul (1,5 part, ou 2 avec la majoration parent isolé),
      soit 0,5 à 1 part de moins.
    - >-
      Pensions de retraite et CSG à taux réduit (specs 0005/0006) — les pensions
      de retraite sont imposables (abattement de 10 % mutualisé avec les pensions
      alimentaires, plancher/plafond communs, cf. `pensions_imposables`) et
      supportent la CSG/CRDS à taux réduit selon le revenu fiscal de référence.
      Simplifications : le taux de CSG dépend légalement du RFR de l'année N-2 et
      d'un RFR au périmètre plus large ; le modèle, mono-année, utilise un RFR
      proxy de l'année courante (salaires imposables + pensions abattues −
      pensions versées). Les majorations de seuils par demi-part sont dérivées
      des seuils publiés 1 part et 2 parts (interpolation linéaire). La CASA
      (0,3 %) n'est pas modélisée. Métropole uniquement.
    - >-
      RSA — base ressources approchée (spec 0002) : la base légale est la
      moyenne des ressources des 3 mois précédant la demande (CASF art. R262-3) ;
      le modèle utilise le revenu annuel modélisé / 12 comme proxy mensuel (même
      simplification que la base ressources des AF). Le périmètre des ressources
      est réduit à ce que le MVP sait modéliser (salaires déclarés, pensions
      alimentaires perçues, AF et ASF ; ni capital, ni revenus de remplacement,
      ni autres prestations). L'abattement / la neutralisation des revenus
      d'activité des 3 premiers mois (art. R262-7) n'est pas appliqué.
    - >-
      RSA — forfait logement appliqué systématiquement : le statut de logement
      n'étant pas modélisé, le forfait logement (CASF art. R262-9) est toujours
      déduit (hypothèse d'un foyer bénéficiant d'une aide au logement ou logé à
      titre gratuit). Un locataire sans aide au logement verrait son RSA
      sous-estimé du montant du forfait.
    - >-
      RSA — socle seul, isolement par proxy : seul le RSA socle est modélisé
      (hors prime d'activité, RSA jeune, cumul intéressement, contrat
      d'engagement et sanctions). Le RSA majoré (parent isolé) est déclenché par
      le proxy « un seul parent avec enfant » (comme l'ASF) et sa durée (jusqu'aux
      3 ans du plus jeune enfant, art. L262-9) n'est pas modélisée. Métropole
      uniquement.
