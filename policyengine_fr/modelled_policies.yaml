core:
  modelled:
    - Impôt sur le revenu — barème progressif par part de quotient familial (2024–2025)
    - Quotient familial — nombre de parts (déclarants + personnes à charge, majoration parent isolé) et plafonnement
    - Décote de l'impôt sur le revenu (célibataire / couple, 2024–2025)
    - Revenu fiscal de référence (RFR) — revenu net imposable + revenus du capital soumis au PFU
    - Cotisations sociales salariales par risque (vieillesse plafonnée/déplafonnée, AGIRC-ARRCO T1/T2, CEG T1/T2, CET, APEC cadre) → salaire déclaré (1AJ) et salaire net
    - Cotisations sociales patronales par risque (bandeaux SMIC maladie et famille, vieillesse, chômage, AGS, FNAL, AT/MP, AGIRC-ARRCO, CEG, CET, APEC, CSA), réduction générale (ex-Fillon) et coût du travail (super-brut)
    - CSG et CRDS sur les revenus d'activité salariée (assiette 98,25 %, fraction déductible 6,8 % déduite du salaire déclaré)
    - Pensions de retraite — abattement commun de 10 % fusionné avec les pensions alimentaires perçues (`pensions_imposables`), CSG par tranches de RFR (0 % / 3,8 % / 6,6 % / 8,3 %), CRDS (0,5 %) et CASA (0,3 %)
    - Pensions alimentaires — déduction du revenu global (versées) et imposition après abattement commun de 10 % (perçues)
    - Allocations familiales — base par nombre d'enfants, modulation selon les revenus avec complément dégressif (CSS art. D521-1), majoration pour âge
    - Allocation de soutien familial (ASF) — taux simple, en complément différentiel de la pension alimentaire perçue (famille monoparentale)
    - Revenu de solidarité active (RSA) — montant forfaitaire (socle + majoration parent isolé), forfait logement, base ressources nette (forfait ASF et exclusion des majorations d'âge AF), condition d'âge/parentalité et seuil de versement de 6 €/mois
    - Prime d'activité (PPA) — montant forfaitaire familial, bonification individuelle (59 à 120 SMIC horaires), pente de 61 % sur les revenus professionnels nets, forfait logement et seuil de versement de 15 €/mois
    - Fiscalité du capital et des hauts revenus — PFU / flat tax (12,8 % IR ou option barème + 17,2 % prélèvements sociaux), revenus fonciers nets (micro-foncier 30 % ou réel), plus-values immobilières (19 % + 17,2 % PS), CEHR (3 % / 4 %) et IFI (abattement 30 % résidence principale, barème dès 1,3 M€, décote)
    - Fiscalité locale et foncière — taxe foncière (TFPB), taxe d'habitation sur les résidences secondaires (THRS) avec frais de gestion de 3 % (CGI art. 1641) et taxe sur la valeur du sol (LVT), accompagnées des réformes paramétrées (`policyengine_fr.reforms.lvt_shift` et `budget_levers`)
    - Revenu disponible — agrégat ménage net d'impôts directs, de cotisations/prélèvements sociaux et incluant les prestations sociales modélisées (2024–2025)
  not_modelled:
    - Réductions et crédits d'impôt sur le revenu (emploi à domicile, garde d'enfants, dons, investissements locatifs…)
    - Aides personnelles au logement (APL, ALS, ALF)
    - Autres prestations familiales et minima sociaux (PAJE, complément familial, ARS, AAH, AEEH, ASPA)
    - Revenus de remplacement hors retraite (allocations chômage ARE, indemnités journalières)
    - Revenus des travailleurs indépendants et non-salariés (BIC, BNC, BA, micro-entrepreneurs)
    - Régimes spéciaux, fonction publique, régime local d'Alsace-Moselle et règles spécifiques aux DOM
  simplifications:
    # Explicit scope-narrowings: modelled, but with a documented departure from
    # the exact statute. Surfaced here so the reviewer-agent gate's
    # "silent scope-narrowing" check can find them, and kept 1-for-1 with the
    # numbered caveats in docs/coverage.md (enforced by bin/check_doc_currency.py).
    - >-
      Cotisations salariales — régime général privé à temps plein uniquement :
      les cotisations salariales par risque modélisent un salarié du secteur
      privé non agricole (non-cadre par défaut, ou `cadre=True` pour l'APEC)
      sans complémentaire santé obligatoire d'entreprise, heures supplémentaires
      exonérées, apprentissage, ni régimes spéciaux, fonction publique ou
      Alsace-Moselle. La CSG sur salaire d'activité est appliquée au taux plein
      de 9,2 % sur 98,25 % du brut.
    - >-
      Cotisations patronales et réduction générale — taux de droit commun sur
      base SMIC temps plein annuel : les bandeaux maladie et famille ainsi que
      la réduction générale dégressive (ex-Fillon jusqu'à 1,6 SMIC, distinguant
      `< 50` et `>= 50` salariés via `effectif_entreprise`) utilisent le SMIC
      annuel temps plein (1 820 h) sans proratisation horaire temps partiel, et
      n'incluent pas le versement mobilité local, le forfait social, la DFS ni
      les exonérations zonées (ZRR, ZFU, JEI, LODEOM).
    - >-
      CSG, CRDS et CASA sur les pensions de retraite — RFR de l'année courante
      et absence de lissage bisannuel : le barème à quatre tranches (0 %, 3,8 %,
      6,6 %, 8,3 % ; CSS art. L136-8 III) et la CASA (0,3 % ; CASF art. L14-10-4)
      sont évalués sur `revenu_fiscal_de_reference` de l'année N en lieu et place
      du RFR N-2, sans la condition de franchissement sur deux années consécutives
      (CSS art. L136-8 III bis).
    - >-
      Revenu fiscal de référence (`revenu_fiscal_de_reference`) — périmètre des
      revenus modélisés : le RFR (CGI art. 1417, IV) additionne le
      `revenu_net_imposable` et les revenus de capitaux mobiliers soumis au PFU
      (`revenus_capitaux_mobiliers_pfu` hors option barème), mais n'intègre pas
      les plus-values mobilières exonérées, les cotisations d'épargne retraite
      déduites ni les revenus exonérés hors périmètre.
    - >-
      Abattement commun de 10 % sur les pensions (`pensions_imposables`) —
      plafond appliqué globalement au foyer fiscal : le plancher individuel est
      borné à la somme `pension_retraite_declaree + pensions_alimentaires_percues`
      de chaque membre, puis le total est plafonné au niveau du foyer fiscal
      (CGI art. 158, 5, a) sans proratisation individuelle du plafond entre
      déclarants.
    - >-
      Pensions alimentaires versées — montant supposé déjà déductible : le
      plafond légal par enfant majeur (CGI art. 156, II, 2°) et les conditions
      d'éligibilité (décision de justice, état de besoin) ne sont pas appliqués
      par le modèle, à l'image d'`openfisca-france` ; `revenu_net_imposable` est
      borné à zéro (déficits reportables non modélisés).
    - >-
      Quotient familial — cas du veuf/de la veuve avec personne à charge non
      représentable : le CGI art. 194 accorde au contribuable veuf ayant des
      enfants à charge les parts de base d'un couple marié (p. ex. 2,5 parts avec
      un enfant) ; faute de statut matrimonial détaillé, le modèle le représente
      comme déclarant seul (1,5 part, ou 2 avec `parent_isole`), soit 0,5 à
      1 part de moins.
    - >-
      Allocations familiales — ressources de l'année N au lieu de N-2 : la
      modulation et le complément dégressif (CSS art. D521-1) utilisent la somme
      des revenus imposables nets des parents de l'année courante
      (`salaire_imposable + pensions_imposables`) en lieu et place du revenu net
      catégoriel N-2 (CSS art. R532-3). Garde alternée, forfait des 20 ans et
      plancher de versement non modélisés.
    - >-
      Allocation de soutien familial — calcul familial et proxy monoparental : le
      droit est inféré du seul critère `nb_parents == 1`, et le complément
      différentiel (`max(asf_pleine - pension/12, 0)`) est calculé globalement au
      niveau de la famille plutôt qu'enfant par enfant. Taux majoré (orphelin des
      deux parents), parent défaillant au sein d'un couple et recouvrement
      CAF↔débiteur non modélisés.
    - >-
      Prestations sociales versées brutes de CRDS et mois des 14 ans AF : les AF,
      l'ASF et la prime d'activité sont versées brutes sans retenue de la CRDS
      de 0,5 % dans `revenu_disponible`, et la majoration pour âge des AF (14 ans)
      s'applique dès le mois/année du 14e anniversaire au lieu du mois suivant.
    - >-
      Revenu de solidarité active (`rsa`) — lissage annuel (`/ 12`), forfait
      logement systématique et éligibilité simplifiée : les ressources d'activité
      et de retraite nettes sont ramenées au mois par division par 12 au lieu
      d'une déclaration trimestrielle (CASF art. R262-7) ; le forfait logement est
      appliqué à toute famille éligible ; la majoration d'isolement est accordée
      sans limite de durée (art. L262-9) ; le RSA jeune actif (< 25 ans, art.
      L262-7-1) et la taxation de l'épargne (3 % / revenus du capital) dans la
      base ressources ne sont pas modélisés.
    - >-
      Prime d'activité (`prime_activite`) — lissage annuel (`/ 12`), forfait
      logement systématique et plancher étudiant/apprenti non modélisé : les
      revenus professionnels nets (`salaire_net / 12`) et de remplacement sont
      lissés sur 12 mois au lieu d'être trimestriels ; le forfait logement est
      systématique ; le plancher de revenus d'activité (~0,78 SMIC net, CSS art.
      L842-2) applicable aux étudiants salariés et apprentis ainsi que l'isolement
      temporaire hors `parent_isole` ne sont pas modélisés.
    - >-
      Fiscalité du capital, revenus fonciers et plus-values immobilières — hors
      abattements de durée de détention et imputation de déficit foncier :
      l'option barème des RCM (`option_bareme_rcm`) n'applique pas l'abattement de
      40 % sur dividendes ; le régime réel foncier n'impute pas les déficits
      fonciers sur le revenu global (plafond de 10 700 €, CGI art. 156, I, 3°) ;
      les `plus_values_immobilieres` saisies sont supposées déjà nettes des
      abattements pour durée de détention (CGI art. 150 VC) et hors surtaxe de
      l'art. 1609 nonies G.
    - >-
      CEHR et IFI — lissage exceptionnel CEHR et plafonnement IFI à 75 % non
      modélisés : la CEHR (CGI art. 223 sexies) est calculée sur le RFR courant
      sans quotient de lissage des revenus exceptionnels ; l'IFI applique
      l'abattement de 30 % sur la résidence principale et la décote (1,3–1,4 M€),
      mais n'applique pas la réduction pour dons (CGI art. 978) ni le plafonnement
      à 75 % des revenus (CGI art. 979).
    - >-
      Fiscalité locale et taxe sur la valeur du sol — taux moyens nationaux par
      défaut : faute de code commune et de taux locaux délibérés, `taxe_fonciere`
      et `taxe_habitation_residence_secondaire` appliquent les taux moyens
      nationaux DGFiP (surchargeables par ménage ou via les réformes
      `lvt_shift`), majorés de 3 % de frais de gestion de l'État (CGI art. 1641),
      sans exonérations ni dégrèvements liés à l'âge ou au RFR.
    - >-
      Périmètre géographique — France métropolitaine uniquement : les réfactions
      d'impôt sur le revenu DOM (30 % / 40 %, CGI art. 197, I, 3), les barèmes et
      montants spécifiques outre-mer (RSA, AF, exonérations LODEOM) et le régime
      local d'Alsace-Moselle ne sont pas modélisés.
