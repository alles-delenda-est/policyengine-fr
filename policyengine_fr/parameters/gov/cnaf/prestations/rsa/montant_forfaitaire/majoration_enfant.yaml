description: Majoration du montant forfaitaire du RSA par enfant à charge de rang 1 ou 2, en part du montant pour une personne seule (CASF art. R262-1). Au-delà du deuxième enfant, le taux passe à 0,4 (voir majoration_enfant_rang_3).
values:
