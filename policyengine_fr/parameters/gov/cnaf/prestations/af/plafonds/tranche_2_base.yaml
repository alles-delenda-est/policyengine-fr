description: Plafond annuel de ressources n°2 des allocations familiales — montant de base hors enfants,
  auquel s'ajoute la majoration par enfant à charge pour chaque enfant (le plafond publié pour deux enfants
  vaut base + 2 × majoration, soit 99 922 € en 2024 et 104 719 € en 2025). Au-delà, les AF sont versées au quart.
values:
  2023-01-01: 83029
  2024-01-01: 87430
  2025-01-01: 91627
