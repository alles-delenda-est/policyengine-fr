description: Plafond annuel de ressources n°1 des allocations familiales — montant de base hors enfants,
  auquel s'ajoute la majoration par enfant à charge pour chaque enfant (le plafond publié pour deux enfants
  vaut base + 2 × majoration, soit 74 966 € en 2024 et 78 565 € en 2025). En deçà, les AF sont versées à taux plein.
values:
  2023-01-01: 59330
  2024-01-01: 62474
  2025-01-01: 65473
