description: Seuil minimal de revenus professionnels mensuels ouvrant droit à la bonification individuelle de la prime d'activité, exprimé en multiple du SMIC horaire brut au 1er janvier (59 × SMIC horaire, soit environ 0,5 SMIC temps plein).
values:
