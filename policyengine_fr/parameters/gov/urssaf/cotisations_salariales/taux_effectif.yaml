description: >-
  Taux effectif forfaitaire des cotisations sociales salariales (hors CSG/CRDS)
  d'un salarié du privé non cadre, exprimé en part du salaire brut. Approximation
  MVP à taux plat servant à passer du salaire brut au salaire déclaré (case 1AJ).
  Somme des principales cotisations salariales de tranche 1 (2024): assurance
  vieillesse plafonnée 6,90 % + déplafonnée 0,40 % + retraite complémentaire
  AGIRC-ARRCO T1 3,15 % + contribution d'équilibre général (CEG) T1 0,86 %
  ≈ 11,31 %. La CSG/CRDS est prélevée séparément et NE doit PAS être incluse ici.
  Simplifications (à raffiner, voir docs/specs/0004): taux unique sans plafond de
  la sécurité sociale (pas de tranche 2), statut cadre (APEC/CET) non distingué,
  chômage salarial nul depuis 2018, maladie salariale nulle (remplacée par la CSG).
values:
  2024-01-01: 0.1131
