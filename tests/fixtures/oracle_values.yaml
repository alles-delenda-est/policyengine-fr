# Independent-oracle reference values: model output vs official French government
# simulators (DGFiP) and `openfisca-france` v175.0.45 (run in `../.venv-of312`).
#
# SALARY CONCEPT (spec 0001):
# - The 10 DGFiP `impot_revenu` rows and 3 `allocations_familiales` rows captured
#   in June 2026 feed DECLARED salaries (`salaire_declare`, case 1AJ).
# - The 10 rows captured on 2026-11-27 (`rsa`, `prime_activite`, `salaire_net`,
#   `salaire_declare`, `reduction_generale`) feed TRUE GROSS salaries
#   (`salaire_brut`) and compare directly against `openfisca-france` v175.0.45
#   (with `statut_occupation_logement = loge_gratuitement` across all 12 months
#   so the statutory forfait logement applies identically in both engines).
meta:
  ir_oracle: "DGFiP simulateur de l'impôt, modèle simplifié, revenus 2024"
  ir_url: "https://simulateur-ir-ifi.impots.gouv.fr/calcul_impot/2025/simplifie/index.htm"
  af_oracle: "openfisca-france v175.0.45 (independent codebase in ../.venv-of312)"
  af_url: "https://github.com/openfisca/openfisca-france"
  tolerances:
    impot_revenu: 5.0
    allocations_familiales: 12.0
    allocation_soutien_familial: 12.0
    rsa: 12.0
    prime_activite: 12.0
    salaire_net: 5.0
    salaire_declare: 5.0
    reduction_generale: 5.0
households:
