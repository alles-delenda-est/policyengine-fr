# Independent-oracle reference values: model output vs the French government's
# own online simulators. `official` stays null until captured by driving the
# simulator (browser / CoWork); `model` is the live policyengine-fr output at
# scaffold time. The comparison test skips any row whose `official` is null, so
# this never produces a false green.
#
# The 10 impot_revenu rows were captured 2026-06-22 from the DGFiP simulator
# (modèle simplifié, revenus 2024) by entering each household and reading
# « Impôt sur le revenu net ». The simulator reports whole euros. Every row
# matched the model to within €0.50 (tolerance €5).
#
# The 3 allocations_familiales rows were captured 2026-06-22 from
# openfisca-france (v175.0.45) — an independent French microsimulation codebase
# — because the DGFiP IR simulator does not output AF. Reproducible via
# tests/oracle/compute_af_openfisca.py. Every row matched within €0.02
# (tolerance €12). The CAF estimateur remains a valid second oracle for a
# manual cross-check (runbook in docs/cowork-validation-brief.md).
#
# The 2 allocation_soutien_familial rows were captured from openfisca-france
# (v175.0.45): taux-simple row 2026-06-22 via compute_asf_annual([8]) — openfisca
# 2336.09 vs model 2336.09 (Δ ≈ 0.00); différentielle row 2026-06-24 via
# compute_asf_differentielle_annual([8], 1200) — openfisca 1136.09 vs model
# 1136.09 (Δ ≈ 0.00). Both rows pass within tolerance €12.
meta:
  ir_oracle: "DGFiP simulateur de l'impôt, modèle simplifié, revenus 2024"
  ir_url: "https://simulateur-ir-ifi.impots.gouv.fr/calcul_impot/2025/simplifie/index.htm"
  af_oracle: "openfisca-france v175.0.45 (independent codebase); CAF estimateur as manual cross-check"
  af_url: "https://github.com/openfisca/openfisca-france"
  tolerances: {impot_revenu: 5.0, allocations_familiales: 12.0, allocation_soutien_familial: 12.0}
  notes: >
    impot_revenu compared directly (annual, €). allocations_familiales compares
    the model's annual total to 12× the CAF monthly estimate; expect noise from
    the BMAF 1-April revalorisation and the MVP base-ressources N-2 simplification
    (model uses current-year salaire_imposable). AF rows are secondary.
households:
  - {id: single_20k,                 variable: impot_revenu,          inputs: {situation: celibataire, parent_isole: false, salaires: [20000],        enfants: []},          period: "2024",    model: 150.02,    official: 150,   captured_on: "2026-06-22"}
  - {id: single_30k,                 variable: impot_revenu,          inputs: {situation: celibataire, parent_isole: false, salaires: [30000],        enfants: []},          period: "2024",    model: 1587.99,   official: 1588,  captured_on: "2026-06-22"}
  - {id: single_50k,                 variable: impot_revenu,          inputs: {situation: celibataire, parent_isole: false, salaires: [50000],        enfants: []},          period: "2024",    model: 6665.48,   official: 6665,  captured_on: "2026-06-22"}
  - {id: single_120k,                variable: impot_revenu,          inputs: {situation: celibataire, parent_isole: false, salaires: [120000],       enfants: []},          period: "2024",    model: 28224.95,  official: 28225, captured_on: "2026-06-22"}
  - {id: single_parent_25k_1child,   variable: impot_revenu,          inputs: {situation: celibataire, parent_isole: true,  salaires: [25000],        enfants: [8]},         period: "2024",    model: 0.0,       official: 0,     captured_on: "2026-06-22"}
  - {id: couple_60k_0child,          variable: impot_revenu,          inputs: {situation: maries,      parent_isole: false, salaires: [60000, 0],     enfants: []},          period: "2024",    model: 3410.66,   official: 3411,  captured_on: "2026-06-22"}
  - {id: couple_60k_2children,       variable: impot_revenu,          inputs: {situation: maries,      parent_isole: false, salaires: [60000, 0],     enfants: [10, 16]},    period: "2024",    model: 1647.05,   official: 1647,  captured_on: "2026-06-22"}
  - {id: couple_90k_3children,       variable: impot_revenu,          inputs: {situation: maries,      parent_isole: false, salaires: [50000, 40000], enfants: [3, 8, 15]},  period: "2024",    model: 3851.32,   official: 3851,  captured_on: "2026-06-22"}
  - {id: couple_200k_3children,      variable: impot_revenu,          inputs: {situation: maries,      parent_isole: false, salaires: [120000, 80000],enfants: [5, 9, 15]},  period: "2024",    model: 34525.90,  official: 34526, captured_on: "2026-06-22"}
  - {id: couple_40k_4children,       variable: impot_revenu,          inputs: {situation: maries,      parent_isole: false, salaires: [40000, 0],     enfants: [2, 6, 11, 15]}, period: "2024", model: 0.0,      official: 0,     captured_on: "2026-06-22"}
  - {id: couple_60k_2children_af,    variable: allocations_familiales, inputs: {situation: maries,     parent_isole: false, salaires: [60000, 0],     enfants: [10, 16]},    period: "2024",    model: 1771.44,   official: 1771.44, captured_on: "2026-06-22"}
  - {id: couple_90k_3children_af,    variable: allocations_familiales, inputs: {situation: maries,     parent_isole: false, salaires: [50000, 40000], enfants: [3, 8, 15]},  period: "2024",    model: 4926.82,   official: 4926.81, captured_on: "2026-06-22"}
  - {id: couple_40k_4children_af,    variable: allocations_familiales, inputs: {situation: maries,     parent_isole: false, salaires: [40000, 0],     enfants: [2, 6, 11, 15]}, period: "2024", model: 7196.48,  official: 7196.46, captured_on: "2026-06-22"}
