[project]
name = "policyengine-fr"
version = "0.1.0"
description = "Microsimulation model for France's tax-benefit system."
readme = "README.md"
authors = [
    { name = "PolicyEngine FR contributors" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "policyengine_core>=3.23.6,<4",
    "numpy",
    "pandas>=2.2.0",
    "pytest",
]

[project.optional-dependencies]
dev = [
    "build",
    "ruff>=0.9.0",
    "hypothesis>=6",
    "jupyter-book<2",
    "towncrier>=24.8.0",
]

[project.urls]
Homepage = "https://github.com/alles-delenda-est/policyengine-fr"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policyengine_fr"]

[tool.towncrier]
package = "policyengine_fr"
directory = "changelog.d"
filename = "CHANGELOG.md"
title_format = "## [{version}] - {project_date}"
issue_format = ""
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501", "E712", "E713", "E721", "E722", "E741", "F401", "F402", "F403", "F405", "F541", "F811", "F841"]
